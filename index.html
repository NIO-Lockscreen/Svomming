<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swim search</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0f1923;color:#e8ecf0;min-height:100vh}
.hdr{background:linear-gradient(135deg,#1a3a5c,#0d2137);padding:14px 22px;border-bottom:2px solid #2a6db5;display:flex;align-items:center;gap:14px}
.hdr-logo{font-size:26px}
.hdr h1{font-size:1.15rem;font-weight:700;color:#4fc3f7}
.body{display:flex;height:calc(100vh - 58px)}
.sidebar{width:260px;min-width:220px;background:#131f2d;border-right:1px solid #1e3a5c;overflow-y:auto;display:flex;flex-direction:column}
.sb-sec{padding:11px 13px;border-bottom:1px solid #1e3a5c}
.sb-sec h3{font-size:0.68rem;text-transform:uppercase;letter-spacing:1px;color:#4fc3f7;margin-bottom:7px}
.search{width:100%;padding:7px 11px;background:#1e2d3e;border:1px solid #2a4a6a;border-radius:7px;color:#e8ecf0;font-size:0.84rem;outline:none}
.search:focus{border-color:#4fc3f7}
.search::placeholder{color:#546e7a}
.evsel-wrap{position:relative}
.evsel{width:100%;padding:7px 28px 7px 10px;background:#1e2d3e;border:1px solid #2a4a6a;border-radius:7px;color:#e8ecf0;font-size:0.8rem;outline:none;cursor:pointer;appearance:none}
.evsel:focus{border-color:#4fc3f7}
.ath-list{flex:1;overflow-y:auto}
.ath-item{padding:9px 13px;cursor:pointer;border-bottom:1px solid #1a2d40;transition:background .15s}
.ath-item:hover{background:#1e2d3e}
.ath-item.active{background:#1a3a5c;border-left:3px solid #4fc3f7;padding-left:10px}
.ath-name{font-size:0.86rem;font-weight:600;color:#e0e7ef}
.ath-club{font-size:0.72rem;color:#78909c;margin-top:2px}
.main{flex:1;overflow-y:auto;padding:18px}
.card{background:#131f2d;border:1px solid #1e3a5c;border-radius:11px;margin-bottom:14px;overflow:hidden}
.card-hdr{background:linear-gradient(90deg,#1a3a5c,#162c45);padding:11px 15px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.card-hdr h2{font-size:0.92rem;color:#4fc3f7;font-weight:700}
.badge{background:#0d47a1;color:#90caf9;padding:2px 9px;border-radius:20px;font-size:0.73rem}
.hero{background:linear-gradient(135deg,#1a3a5c,#0d2137);border:1px solid #2a6db5;border-radius:13px;padding:18px;margin-bottom:16px;display:flex;align-items:center;gap:16px}
.avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#1565c0,#4fc3f7);display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;color:#fff;flex-shrink:0}
.hero-info h2{font-size:1.1rem;color:#e0e7ef}
.born{font-size:0.8rem;color:#78909c;margin:3px 0}
.club-lbl{font-size:0.86rem;color:#4fc3f7}
.res-row{display:flex;align-items:center;padding:9px 15px;border-bottom:1px solid #1a2d40;gap:11px;transition:background .15s}
.res-row:hover{background:#1a2d40}
.res-row:last-child{border-bottom:none}
.rank{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.74rem;font-weight:700;flex-shrink:0;background:#1e2d3e;color:#90a4ae}
.r1{background:#f9a825;color:#1a1000}
.r2{background:#78909c;color:#fff}
.r3{background:#bf360c;color:#fff}
.res-info{flex:1;min-width:0}
.res-ev{font-size:0.84rem;font-weight:600;color:#b0c4de;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-cls{font-size:0.71rem;color:#546e7a;margin-top:2px}
.res-time{font-size:0.95rem;font-weight:700;color:#4fc3f7;font-family:monospace;white-space:nowrap}
.dnf{color:#ef5350;font-size:0.82rem}
.cls-hdr{padding:6px 15px;background:#0d1b2a;color:#78909c;font-size:0.71rem;text-transform:uppercase;letter-spacing:.5px}
.stats-row{display:flex;gap:18px;flex-wrap:wrap;padding:12px 15px;border-top:1px solid #1a2d40}
.stat-item{display:flex;flex-direction:column;gap:3px}
.stat-lbl{font-size:0.68rem;color:#546e7a;text-transform:uppercase;letter-spacing:.5px}
.stat-val{font-size:.95rem;font-weight:700;color:#e0e7ef}
.splits-wrap{padding:12px 15px}
.splits-title{font-size:0.68rem;color:#546e7a;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
.splits-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.split-cell{background:#1a2d40;border-radius:6px;padding:7px;text-align:center;font-size:0.8rem;color:#b0bec5;font-family:monospace}
.loading{text-align:center;padding:40px;color:#4fc3f7}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid #1e3a5c;border-top-color:#4fc3f7;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:36px;color:#546e7a}
.empty .ico{font-size:2.3rem;margin-bottom:9px}
.welcome{text-align:center;padding:60px 20px}
.welcome .ico{font-size:3.2rem;margin-bottom:12px}
.welcome h2{font-size:1.2rem;color:#4fc3f7;margin-bottom:7px}
.welcome p{color:#78909c;font-size:0.86rem;line-height:1.6;max-width:380px;margin:0 auto}
.back-btn{background:#1e2d3e;border:1px solid #2a4a6a;color:#90caf9;padding:6px 15px;border-radius:7px;cursor:pointer;margin-bottom:14px;font-size:0.81rem;display:inline-block}
.back-btn:hover{background:#1a3a5c}
.proxy-info{font-size:0.7rem;color:#546e7a;padding:4px 13px 8px;font-style:italic}
.meet-note{font-size:0.72rem;color:#78909c;padding:7px 13px;border-bottom:1px solid #1e3a5c;line-height:1.35}
.evsel:disabled,.search:disabled{opacity:.55;cursor:not-allowed}

.best-box{margin-top:12px;background:#0d1b2a;border:1px solid #1e3a5c;border-radius:10px;padding:11px}
.best-title{font-size:.78rem;color:#90caf9;font-weight:700;margin-bottom:7px;text-transform:uppercase;letter-spacing:.5px}
.best-controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.best-controls select{flex:1;min-width:160px}
.small-btn{background:#1565c0;border:1px solid #2a6db5;color:#e3f2fd;padding:7px 12px;border-radius:7px;cursor:pointer;font-size:.8rem;font-weight:700}
.small-btn:hover{background:#1e88e5}
.small-btn:disabled{opacity:.55;cursor:not-allowed}
.best-status{font-size:.78rem;color:#b0bec5;margin-top:8px;line-height:1.45}
.best-result{background:#132536;border:1px solid #2a4a6a;border-radius:8px;padding:9px;margin-top:8px}
.best-result strong{color:#4fc3f7;font-family:monospace;font-size:1.05rem}
.best-meta{font-size:.74rem;color:#78909c;margin-top:4px}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#0f1923}
::-webkit-scrollbar-thumb{background:#1e3a5c;border-radius:3px}
@media(max-width:600px){
  .body{flex-direction:column}
  .sidebar{width:100%;max-height:38vh;min-width:unset}
  .splits-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-logo">&#x1F3CA;</div>
  <div>
    <h1>Swim search</h1>
  </div>
</div>
<div class="body">
  <div class="sidebar">
    <div class="sb-sec">
      <h3>Velg årstall</h3>
      <div class="evsel-wrap">
        <select class="evsel" id="yearSel"></select>
      </div>
    </div>
    <div class="sb-sec">
      <h3>Velg stevne</h3>
      <div class="evsel-wrap">
        <select class="evsel" id="meetSel"><option value="">-- Velg stevne --</option></select>
      </div>
    </div>
    <div class="sb-sec">
      <h3>Søk utøver</h3>
      <input class="search" id="srch" placeholder="Navn eller klubb..." autocomplete="off">
    </div>
    <div class="sb-sec">
      <h3>Velg øvelse</h3>
      <div class="evsel-wrap">
        <select class="evsel" id="evsel"><option value="">-- Velg øvelse --</option></select>
      </div>
    </div>
    <div id="meetNote" class="meet-note"></div>
    <div id="proxyInfo" class="proxy-info"></div>
    <div class="ath-list" id="athList">
      <div class="empty"><div class="ico">&#x1F3CA;</div><p>Velg stevne først</p></div>
    </div>
  </div>
  <div class="main" id="main">
    <div class="welcome">
      <div class="ico">&#x1F3C5;</div>
      <h2>Velg årstall og stevne</h2>
      <p>Velg årstall, deretter stevne. Når stevnet er lastet kan du søke etter utøver eller velge øvelse.</p>
    </div>
  </div>
</div>
<script>
(function(){
  var BASE = 'https://ltmobil.medley.no';
  var cache = {};
  var athletes = [];
  var eventOvnrs = [];
  var currentMeetNo = '';
  var currentMeetName = '';
  var currentYear = '';
  var currentProxyIndex = null;

  // Krever at du har /api/medley i prosjektet ditt.
  // Browseren henter fra samme domene, og API-filen henter HTML fra ltmobil.medley.no.
  var PROXIES = [
    { name:'Egen online API', make:function(full){ return '/api/medley?url=' + encodeURIComponent(full); }, type:'text' }
  ];

  try {
    var saved = localStorage.getItem('swimSearchProxyIndex');
    if (saved !== null && !isNaN(parseInt(saved, 10))) currentProxyIndex = parseInt(saved, 10);
  } catch (_) {}

  function byId(id){ return document.getElementById(id); }

  function proxyInfo(txt) {
    var el = byId('proxyInfo');
    if (el) el.textContent = txt || '';
  }

  function meetNote(txt) {
    var el = byId('meetNote');
    if (el) el.textContent = txt || '';
  }

  function absolute(path) {
    if (/^https?:\/\//i.test(path)) return path;
    return BASE + path;
  }

  function cleanText(s) {
    return String(s || '').replace(/\s+/g, ' ').trim();
  }

  function normalizeOvnr(v, label) {
    v = String(v || '');
    var m = v.match(/[?&]ovnr=(\d+)/i) || v.match(/^(\d+)$/) || String(label || '').match(/Øvelse\s+(\d+)/i);
    return m ? m[1] : '';
  }

  function fetchWithTimeout(url, options, ms) {
    options = options || {};
    ms = ms || 18000;
    if (!window.AbortController) return fetch(url, options);
    var controller = new AbortController();
    options.signal = controller.signal;
    var timer = setTimeout(function(){ controller.abort(); }, ms);
    return fetch(url, options).finally(function(){ clearTimeout(timer); });
  }

  function candidateProxyIndexes() {
    var indexes = [];
    for (var i = 0; i < PROXIES.length; i++) indexes.push(i);
    if (currentProxyIndex !== null && indexes.indexOf(currentProxyIndex) >= 0) {
      indexes = [currentProxyIndex].concat(indexes.filter(function(x){ return x !== currentProxyIndex; }));
    }
    return indexes;
  }

  function looksLikeHtml(text) {
    if (!text) return false;
    var sample = String(text).slice(0, 10000);
    return sample.indexOf('<html') >= 0 ||
           sample.indexOf('Livetiming') >= 0 ||
           sample.indexOf('panResultatlister') >= 0 ||
           sample.indexOf('ddlEnkeltOvelser') >= 0 ||
           sample.indexOf('Stevner') >= 0 ||
           sample.indexOf('Resultatliste') >= 0;
  }

  function fetchVia(proxyIndex, fullUrl) {
    var p = PROXIES[proxyIndex];
    var url = p.make(fullUrl);
    return fetchWithTimeout(url, { cache:'no-store', credentials:'omit', mode:'cors' }, 18000)
      .then(function(r) {
        if (!r.ok) throw new Error(p.name + ': HTTP ' + r.status);
        return r.text();
      })
      .then(function(text) {
        if (!looksLikeHtml(text)) {
          var preview = String(text || '').replace(/\s+/g, ' ').slice(0, 140);
          throw new Error(p.name + ': fikk ikke HTML' + (preview ? ' (' + preview + ')' : ''));
        }
        currentProxyIndex = proxyIndex;
        try { localStorage.setItem('swimSearchProxyIndex', String(proxyIndex)); } catch (_) {}
        proxyInfo('Henter via egen online API (/api/medley)');
        return text;
      });
  }

  function fpSmart(path, noCache) {
    var full = absolute(path);
    if (!noCache && cache[full]) return Promise.resolve(cache[full]);

    var indexes = candidateProxyIndexes();
    var errors = [];

    function tryNext(pos) {
      if (pos >= indexes.length) {
        throw new Error('Kunne ikke hente data. Siste feil: ' + errors.join(' | '));
      }
      var idx = indexes[pos];
      return fetchVia(idx, full).catch(function(err) {
        errors.push(err.message || String(err));
        return tryNext(pos + 1);
      });
    }

    return tryNext(0).then(function(text) {
      var d = new DOMParser().parseFromString(text, 'text/html');
      if (!noCache) cache[full] = d;
      return d;
    });
  }

  function resetForMeetChange() {
    athletes = [];
    eventOvnrs = [];
    byId('srch').value = '';
    byId('athList').innerHTML = '<div class="empty"><div class="ico">🏊</div><p>Velg stevne først</p></div>';
    byId('evsel').innerHTML = '<option value="">-- Velg øvelse --</option>';
    byId('evsel').disabled = true;
    byId('main').innerHTML = '<div class="welcome"><div class="ico">🏅</div><h2>Velg årstall og stevne</h2><p>Velg årstall, deretter stevne. Når stevnet er lastet kan du søke etter utøver eller velge øvelse.</p></div>';
  }

  function initYearSelect() {
    var ys = byId('yearSel');
    var now = new Date().getFullYear();
    var maxYear = Math.max(2026, now);
    var wanted = '';
    try { wanted = localStorage.getItem('swimSearchYear') || ''; } catch (_) {}
    var urlYear = new URLSearchParams(window.location.search).get('year');
    if (urlYear && /^\d{4}$/.test(urlYear)) wanted = urlYear;
    if (!wanted) wanted = String(maxYear);

    ys.innerHTML = '';
    for (var y = maxYear; y >= 2010; y--) {
      var o = document.createElement('option');
      o.value = String(y);
      o.textContent = String(y);
      if (String(y) === wanted) o.selected = true;
      ys.appendChild(o);
    }
    currentYear = ys.value;
  }

  function yearCandidatePaths(year) {
    return [
      '/',
      '/default.aspx',
      '/default.aspx?aar=' + encodeURIComponent(year),
      '/default.aspx?ar=' + encodeURIComponent(year),
      '/default.aspx?year=' + encodeURIComponent(year),
      '/default.aspx?y=' + encodeURIComponent(year),
      '/default.aspx?yyyy=' + encodeURIComponent(year)
    ];
  }

  function labelHasYear(label, year) {
    if (!year) return true;
    var y = String(year);
    if (String(label || '').indexOf(y) >= 0) return true;
    var m = String(label || '').match(/\b(\d{2}\.\d{2}\.(\d{4}))(?:\s*-\s*(\d{2}\.\d{2}\.(\d{4})))?/);
    return !!(m && (m[2] === y || m[4] === y));
  }

  function dateFromLabel(label) {
    var m = String(label || '').match(/\b(\d{2})\.(\d{2})\.(\d{4})\b/);
    if (!m) return 0;
    return new Date(parseInt(m[3],10), parseInt(m[2],10) - 1, parseInt(m[1],10)).getTime();
  }

  function normalizeMeetLabel(label) {
    label = cleanText(label)
      .replace(/\bDetaljer\b.*$/i, '')
      .replace(/\bMobil\b.*$/i, '')
      .replace(/\bLivetiming\b.*$/i, '')
      .replace(/\s+/g, ' ')
      .trim();
    return label;
  }

  function parseMeets(doc, year) {
    var map = new Map();
    var links = doc.querySelectorAll('a[href]');
    links.forEach(function(a) {
      var href = a.getAttribute('href') || '';
      var m = href.match(/stevnenr=(\d+)/i);
      if (!m) return;
      var sn = m[1];
      if (!sn || sn === '0') return;

      var label = '';
      var li = a.closest ? a.closest('li') : null;
      if (li) label = cleanText(li.textContent);
      if (!label || label.length < 12) {
        var tr = a.closest ? a.closest('tr') : null;
        if (tr) label = cleanText(tr.textContent);
      }
      if (!label) {
        var p = a.parentElement;
        label = p ? cleanText(p.textContent) : cleanText(a.textContent);
      }
      label = normalizeMeetLabel(label);
      if (!label || label.length < 3) label = cleanText(a.textContent);
      if (!label || /^Stevneoversikt$/i.test(label)) return;
      if (!labelHasYear(label, year)) return;

      if (!map.has(sn)) map.set(sn, { sn: sn, label: label, date: dateFromLabel(label) });
    });
    return Array.from(map.values()).sort(function(a,b){ return (b.date || 0) - (a.date || 0); });
  }

  function candidateMeetRange(year) {
    var y = parseInt(year, 10);
    var ranges = {
      2026:[5450,5900], 2025:[4950,5500], 2024:[4450,5100], 2023:[3950,4600],
      2022:[3500,4100], 2021:[3100,3650], 2020:[2800,3300], 2019:[2500,3000],
      2018:[2200,2650], 2017:[1900,2400], 2016:[1600,2100], 2015:[1300,1800],
      2014:[1000,1500], 2013:[700,1200], 2012:[400,950], 2011:[150,650], 2010:[1,450]
    };
    if (ranges[y]) return ranges[y];
    var high = 5900 - ((2026 - y) * 430);
    return [Math.max(1, high - 650), Math.max(350, high + 100)];
  }

  function parseMeetFromStevneDoc(doc, sn, year) {
    var body = cleanText(doc.body ? doc.body.textContent : doc.textContent);
    if (!body || !/\b(Startlister|Resultater|Heatlister|Søkbare lister)\b/i.test(body)) return null;
    var h2 = doc.querySelector('h2');
    var title = h2 ? cleanText(h2.textContent) : '';
    if (!title || /^Livetiming/i.test(title) || /^Stevneoversikt$/i.test(title)) return null;
    var dm = body.match(/\b(\d{2}\.\d{2}\.(\d{4}))(?:\s*-\s*(\d{2}\.\d{2}\.(\d{4})))?/);
    if (!dm) return null;
    var y = String(year || '');
    if (y && dm[2] !== y && dm[4] !== y) return null;
    var afterTitle = body.split(title).slice(1).join(title);
    var beforeLists = afterTitle.split(/\bSøkbare lister\b/i)[0] || '';
    var dateIdx = beforeLists.indexOf(dm[0]);
    var place = dateIdx > 0 ? cleanText(beforeLists.slice(0, dateIdx)) : '';
    place = place.replace(/^[-–—:\s]+|[-–—:\s]+$/g, '');
    var label = title + (place ? ' ' + place : '') + ' ' + dm[0];
    return { sn: String(sn), label: normalizeMeetLabel(label), date: dateFromLabel(label) };
  }

  function localMeetListKey(year) {
    return 'swimSearchMeetList_v4_' + String(year);
  }

  function getStoredMeetList(year) {
    try {
      var raw = localStorage.getItem(localMeetListKey(year));
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (!obj || !Array.isArray(obj.meets) || !obj.meets.length) return null;
      if (Date.now() - (obj.saved || 0) > 1000 * 60 * 60 * 24 * 14) return null;
      return obj.meets;
    } catch (_) { return null; }
  }

  function storeMeetList(year, meets) {
    try { localStorage.setItem(localMeetListKey(year), JSON.stringify({ saved: Date.now(), meets: meets })); } catch (_) {}
  }

  function scanMeetNumbersForYear(year, onProgress) {
    year = String(year);
    var stored = getStoredMeetList(year);
    if (stored && stored.length) return Promise.resolve(stored);

    var range = candidateMeetRange(year);
    var nums = [];
    for (var n = range[1]; n >= range[0]; n--) nums.push(n);

    var found = new Map();
    var index = 0, done = 0;
    var workers = Math.min(14, nums.length);
    if (onProgress) onProgress({ done:0, total:nums.length, found:0, range:range });

    function worker() {
      var n = nums[index++];
      if (!n) return Promise.resolve();
      return fpSmart('/stevne.aspx?stevnenr=' + encodeURIComponent(n), true)
        .then(function(doc) {
          var m = parseMeetFromStevneDoc(doc, n, year);
          if (m && !found.has(m.sn)) found.set(m.sn, m);
        })
        .catch(function(){})
        .then(function() {
          done++;
          if (onProgress && (done % 20 === 0 || done === nums.length)) onProgress({ done:done, total:nums.length, found:found.size, range:range });
          return worker();
        });
    }

    var ps = [];
    for (var i = 0; i < workers; i++) ps.push(worker());
    return Promise.all(ps).then(function() {
      var meets = Array.from(found.values()).sort(function(a,b){ return (b.date || 0) - (a.date || 0); });
      if (meets.length) storeMeetList(year, meets);
      return meets;
    });
  }

  function getMeetListForYear(year, onProgress) {
    year = String(year);
    if (meetListCache[year]) return Promise.resolve(meetListCache[year]);
    var stored = getStoredMeetList(year);
    if (stored && stored.length) {
      meetListCache[year] = stored;
      return Promise.resolve(stored);
    }

    var paths = yearCandidatePaths(year);
    function tryPath(i) {
      if (i >= paths.length) return Promise.resolve([]);
      return fpSmart(paths[i])
        .then(function(doc) {
          var meets = parseMeets(doc, year);
          if (meets.length) return meets;
          return tryPath(i + 1);
        })
        .catch(function(){ return tryPath(i + 1); });
    }

    return tryPath(0).then(function(meets) {
      if (meets.length) {
        meetListCache[year] = meets;
        storeMeetList(year, meets);
        return meets;
      }
      if (onProgress) onProgress({ fallback:true });
      return scanMeetNumbersForYear(year, onProgress).then(function(scanned) {
        if (scanned.length) {
          meetListCache[year] = scanned;
          return scanned;
        }
        return [];
      });
    });
  }

  var meetLoadToken = 0;
  function loadMeetsForYear(year) {
    currentYear = String(year);
    var token = ++meetLoadToken;
    try { localStorage.setItem('swimSearchYear', currentYear); } catch (_) {}
    resetForMeetChange();

    var meetSel = byId('meetSel');
    meetSel.disabled = true;

  function parseEventOptions(doc) {
    var evsel = byId('evsel');
    evsel.innerHTML = '<option value="">-- Velg øvelse --</option>';
    var seen = new Set();
    var result = [];

    function addEvent(ovnr, label) {
      ovnr = normalizeOvnr(ovnr, label);
      label = cleanText(label);
      if (!ovnr || seen.has(ovnr)) return;
      if (!label || !/Øvelse/i.test(label)) label = 'Øvelse ' + ovnr;
      seen.add(ovnr);
      result.push(ovnr);
      var o = document.createElement('option');
      o.value = ovnr;
      o.textContent = label;
      evsel.appendChild(o);
    }

    var sel = doc.getElementById('ddlEnkeltOvelser');
    if (!sel) {
      var selects = doc.querySelectorAll('select');
      for (var s = 0; s < selects.length; s++) {
        if (selects[s].textContent.indexOf('Øvelse') >= 0) { sel = selects[s]; break; }
      }
    }
    if (sel) {
      Array.from(sel.options).forEach(function(opt) {
        addEvent(opt.value, opt.textContent);
      });
    }

    doc.querySelectorAll('a[href*="ovnr="]').forEach(function(a) {
      addEvent(a.getAttribute('href') || '', a.textContent || '');
    });

    eventOvnrs = result;
    evsel.disabled = eventOvnrs.length === 0;
    return result;
  }

  function loadMeet(sn, label) {

  function loadAthletes() {
    var map = new Map();
    var nums = eventOvnrs.slice();
    var rendered = false;
    var idx = 0;

    function progress() {
      var el = byId('athList');
      if (!rendered && el) {
        el.innerHTML = '<div class="loading"><div class="spinner"></div><br>Laster utøvere...<br><small>' + idx + ' av ' + nums.length + ' øvelser</small></div>';
      }
    }

    function next() {
      if (!currentMeetNo) return;
      if (idx >= nums.length) {
        athletes = Array.from(map.values()).sort(function(a,b) {
          return a.name.localeCompare(b.name, 'no');
        });
        renderList(athletes);
        return;
      }
      progress();
      var n = nums[idx++];
      fpSmart('/resultater.aspx?stevnenr=' + encodeURIComponent(currentMeetNo) + '&ovnr=' + encodeURIComponent(n))
        .then(function(doc) {
          var lis = doc.querySelectorAll('#panResultatlister li');
          lis.forEach(function(li) {
            var a = li.querySelector('a');
            if (!a) return;
            var href = a.getAttribute('href') || '';
            var rm = href.match(/resid=(\d+)/);
            if (!rm) return;
            var resid = rm[1];
            var smalls = li.querySelectorAll('small');
            var name = '', club = '';
            if (smalls.length >= 2) name = smalls[0].textContent.trim();
            if (smalls.length >= 4) club = smalls[2].textContent.trim();
            else if (smalls.length >= 2) club = smalls[1].textContent.trim();
            if (name && !map.has(name + '|' + club)) {
              map.set(name + '|' + club, { name: name, club: club, resid: resid, pid: null });
            }
          });
          if (!rendered && map.size > 5) {
            athletes = Array.from(map.values()).sort(function(a,b) {
              return a.name.localeCompare(b.name, 'no');
            });
            renderList(athletes);
            rendered = true;
          }
        })
        .catch(function() {})
        .then(next);
    }
    next();
  }

  var bestSearchToken = 0;
  var meetListCache = {};
  var meetEventCache = {};

  var CANONICAL_EVENTS = [
    '50m fri','100m fri','200m fri','400m fri','800m fri','1500m fri',
    '50m rygg','100m rygg','200m rygg',
    '50m bryst','100m bryst','200m bryst',
    '50m butterfly','100m butterfly','200m butterfly',
    '100m individuell medley','200m individuell medley','400m individuell medley'
  ];

  function normKey(s) {
    return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
  }

  function canonicalEventName(label) {
    var s = cleanText(label).toLowerCase();
    if (!s) return '';
    if (/\b(4\s*\*|4x|lag|stafett|relay|mixed)\b/i.test(s)) return '';
    s = s.replace(/^øvelse\s*\d+\.?\s*/i, '')
         .replace(/\s*-\s*(forsøk|finale|semifinale).*$/i, '')
         .replace(/,\s*(damer|herrer|jenter|gutter|kvinner|menn).*$/i, '')
         .replace(/\s+/g, ' ')
         .trim();
    var m = s.match(/\b(50|100|200|400|800|1500)m\s+(fri|rygg|bryst|butterfly|individuell\s+medley)\b/i);
    if (!m) return '';
    return (m[1] + 'm ' + m[2].replace(/\s+/g, ' ')).toLowerCase();
  }

  function parseSwimTime(timeText) {
    var t = String(timeText || '').trim();
    if (!t || /DNF|DNS|DSQ|DISK|BRUTT/i.test(t)) return null;
    t = t.replace(/\s+/g, '').replace(',', '.');
    if (!/^[0-9.]+$/.test(t)) return null;
    var parts = t.split('.');
    if (parts.length === 1) return parseFloat(parts[0]);
    if (parts.length === 2) return parseFloat(parts[0] + '.' + parts[1]);
    var minutes = parseInt(parts[0], 10);
    var seconds = parseInt(parts[1], 10);
    var decimals = parseFloat('0.' + parts.slice(2).join(''));
    if (isNaN(minutes) || isNaN(seconds) || isNaN(decimals)) return null;
    return minutes * 60 + seconds + decimals;
  }

  function eventOptionsFromDoc(doc) {
    var seen = new Set();
    var out = [];
    function add(ovnr, label) {
      ovnr = normalizeOvnr(ovnr, label);
      label = cleanText(label);
      if (!ovnr || seen.has(ovnr)) return;
      var key = canonicalEventName(label);
      seen.add(ovnr);
      out.push({ ovnr: ovnr, label: label || ('Øvelse ' + ovnr), key: key });
    }
    var sel = doc.getElementById('ddlEnkeltOvelser');
    if (!sel) {
      var selects = doc.querySelectorAll('select');
      for (var s = 0; s < selects.length; s++) {
        if (selects[s].textContent.indexOf('Øvelse') >= 0) { sel = selects[s]; break; }
      }
    }
    if (sel) Array.from(sel.options).forEach(function(opt){ add(opt.value, opt.textContent); });
    doc.querySelectorAll('a[href*="ovnr="]').forEach(function(a){ add(a.getAttribute('href') || '', a.textContent || ''); });
    return out;
  }

  function getYearValuesForGlobalSearch() {
    var ys = Array.from(byId('yearSel').options).map(function(o){ return o.value; }).filter(Boolean);
    ys.sort(function(a,b){ return parseInt(b,10) - parseInt(a,10); });
    return ys;
  }

  function parseRowsFromEventDoc(doc) {
    var rows = [];
    var lis = doc.querySelectorAll('#panResultatlister li');
    lis.forEach(function(li) {
      var a = li.querySelector('a');
      var href = a ? a.getAttribute('href') || '' : '';
      var rm = href.match(/resid=(\d+)/);
      var resid = rm ? rm[1] : '';
      var smalls = li.querySelectorAll('small');
      var name = '', club = '', time = '';
      if (smalls.length >= 6) {
        name = smalls[0].textContent.trim();
        club = smalls[2].textContent.trim();
        time = smalls[4].textContent.trim();
      } else if (smalls.length >= 4) {
        name = smalls[0].textContent.trim();
        club = smalls[2].textContent.trim();
        time = smalls[3].textContent.trim();
      } else if (smalls.length >= 3) {
        name = smalls[0].textContent.trim();
        club = smalls[1].textContent.trim();
        time = smalls[2].textContent.trim();
      } else if (smalls.length >= 2) {
        name = smalls[0].textContent.trim();
        time = smalls[1].textContent.trim();
      }
      if (name && resid) rows.push({ name:name, club:club, time:time, resid:resid });
    });

  function verifyResultBirthYear(sn, resid, expectedYear) {
    if (!expectedYear) return Promise.resolve(true);
    return fpSmart('/resultater.aspx?stevnenr=' + encodeURIComponent(sn) + '&resid=' + encodeURIComponent(resid))
      .then(function(doc) {
        var person = doc.getElementById('lblPerson') ? doc.getElementById('lblPerson').textContent.trim() : '';
        var m = person.match(/\((\d{4})\)/);
        return !m || m[1] === String(expectedYear);
      })
      .catch(function(){ return true; });
  }

  function runBestGlobalSearch(profile, eventKey, eventLabel) {
    if (!profile || !profile.name || !eventKey) return;
    var token = ++bestSearchToken;
    var status = byId('bestStatus');
    var btn = byId('bestSearchBtn');
    if (btn) btn.disabled = true;
    status.innerHTML = 'Starter søk i alle år og stevner. Dette kan ta litt tid...';

    var years = getYearValuesForGlobalSearch();
    var totalMeets = 0, checkedMeets = 0, checkedEvents = 0, matches = 0;
    var best = null;
    var nameKey = normKey(profile.name);

    function updateStatus(extra) {
      if (token !== bestSearchToken) return;
      var txt = 'Sjekker ' + checkedMeets + (totalMeets ? ' av ' + totalMeets : '') + ' stevner, ' + checkedEvents + ' øvelser. Treffer: ' + matches + '.';
      if (best) txt += '<div class="best-result"><strong>' + e(best.time) + '</strong><div class="best-meta">' + e(best.eventLabel) + '<br>' + e(best.meetLabel) + '<br>' + e(best.club || '') + '</div></div>';
      if (extra) txt += '<div class="best-meta">' + e(extra) + '</div>';
      status.innerHTML = txt;
    }

    function scanEvent(meet, ev) {
      if (token !== bestSearchToken) return Promise.resolve();
      checkedEvents++;
      return fpSmart('/resultater.aspx?stevnenr=' + encodeURIComponent(meet.sn) + '&ovnr=' + encodeURIComponent(ev.ovnr))
        .then(function(doc) {
          var rows = parseRowsFromEventDoc(doc).filter(function(r) {
            return normKey(r.name) === nameKey && parseSwimTime(r.time) !== null;
          });
          var seq = Promise.resolve();
          rows.forEach(function(r) {
            seq = seq.then(function() {
              return verifyResultBirthYear(meet.sn, r.resid, profile.birthYear).then(function(ok) {
                if (!ok || token !== bestSearchToken) return;
                var seconds = parseSwimTime(r.time);
                if (seconds === null) return;
                matches++;
                if (!best || seconds < best.seconds) {
                  best = {
                    seconds: seconds,
                    time: r.time,
                    club: r.club,
                    meetLabel: meet.label,
                    eventLabel: ev.label,
                    sn: meet.sn,
                    resid: r.resid
                  };
                }
              });
            });
          });
          return seq;
        })
        .catch(function(){})
        .then(function(){ updateStatus(); });
    }

    function scanMeet(meet) {
      if (token !== bestSearchToken) return Promise.resolve();
      checkedMeets++;
      var eventPromise;
      if (meetEventCache[meet.sn]) eventPromise = Promise.resolve(meetEventCache[meet.sn]);
      else eventPromise = fpSmart('/resultater.aspx?stevnenr=' + encodeURIComponent(meet.sn))
        .then(function(doc) {
          var events = eventOptionsFromDoc(doc);
          meetEventCache[meet.sn] = events;
          return events;
        })
        .catch(function(){ return []; });

      return eventPromise.then(function(events) {
        var wanted = events.filter(function(ev){ return ev.key === eventKey; });
        var seq = Promise.resolve();
        wanted.forEach(function(ev){ seq = seq.then(function(){ return scanEvent(meet, ev); }); });
        return seq;
      }).then(function(){ updateStatus(); });
    }

    var allMeets = [];
    var yearSeq = Promise.resolve();
    years.forEach(function(year) {
      yearSeq = yearSeq.then(function() {
        if (token !== bestSearchToken) return;
        status.innerHTML = 'Henter stevner for ' + e(year) + '...';
        return loadMeetsForYearData(year).then(function(meets) {
          allMeets = allMeets.concat(meets);
          totalMeets = allMeets.length;
          updateStatus('Hentet ' + meets.length + ' stevner for ' + year + '.');
        });
      });
    });

    yearSeq.then(function() {
      var seq = Promise.resolve();
      allMeets.forEach(function(meet) {
        seq = seq.then(function(){ return scanMeet(meet); });
      });
      return seq;
    }).then(function() {
      if (token !== bestSearchToken) return;
      if (btn) btn.disabled = false;
      if (best) {
        status.innerHTML = '<div class="best-result"><div class="best-title">Beste funnet for ' + e(eventLabel) + '</div><strong>' + e(best.time) + '</strong><div class="best-meta">' + e(best.eventLabel) + '<br>' + e(best.meetLabel) + '<br>' + e(best.club || '') + '</div></div>';
      } else {
        status.innerHTML = 'Fant ingen godkjent tid for ' + e(profile.name) + ' på ' + e(eventLabel) + ' i de årene/stevnene som ble hentet.';
      }
    }).catch(function(err) {
      if (btn) btn.disabled = false;
      status.innerHTML = 'Kunne ikke gjennomføre søket: ' + e(err.message || err);
    });
  }

            var tc = ['DNF','DSQ','DNS','DISK'].indexOf(r.time) >= 0 ? 'dnf' : '';
            h += '<div class="res-row" style="' + (r.resid ? 'cursor:pointer' : '') + '" ' +
                 (r.resid ? 'data-resid="'+e(r.resid)+'" data-event="'+e(r.event)+'" data-pid="'+e(pid)+'"' : '') + '>' +
                 '<div class="rank ' + rc + '">' + e(r.rank) + '</div>' +
                 '<div class="res-info"><div class="res-ev">' + e(r.event) + '</div>' +
                 (r.klasse ? '<div class="res-cls">' + e(r.klasse) + '</div>' : '') +
                 '</div><div class="res-time ' + tc + '">' + e(r.time) + '</div></div>';
          });
        }
        h += '</div>';
        main.innerHTML = h;

        var bestBtn = byId('bestSearchBtn');
        if (bestBtn) {
          bestBtn.addEventListener('click', function() {
            var sel = byId('bestEventSel');
            var key = sel ? sel.value : '';
            runBestGlobalSearch({ name:name, birthYear:year, club:club }, key, key);
          });
        }

        main.querySelectorAll('[data-resid][data-pid]').forEach(function(el) {
          el.addEventListener('click', function() {
            showDetail(el.dataset.resid, el.dataset.event, el.dataset.pid);
          });
        });
      })
      .catch(function(err) {
        byId('main').innerHTML = '<div class="empty"><p>Feil: ' + e(err.message || err) + '</p></div>';
      });
  }

  function showDetail(resid, eventName, backPid) {
    if (!currentMeetNo) return;
    var main = byId('main');
    main.innerHTML = '<div class="loading"><div class="spinner"></div><br>Laster detaljer...</div>';

    fpSmart('/resultater.aspx?stevnenr=' + encodeURIComponent(currentMeetNo) + '&resid=' + encodeURIComponent(resid))
      .then(function(doc) {
        var person = doc.getElementById('lblPerson') ? doc.getElementById('lblPerson').textContent.trim() : '';
        var club   = doc.getElementById('lblKlubb')  ? doc.getElementById('lblKlubb').textContent.trim()  : '';

        if (!backPid) {
          var links = doc.querySelectorAll('a');
          for (var i = 0; i < links.length; i++) {
            var href = links[i].getAttribute('href') || '';
            var m = href.match(/pid=(\d+)/);
            if (m) { backPid = m[1]; break; }
          }
        }

        var pan = doc.getElementById('panResultatlister');
        var sluttid = '', fina = '', pameld = '';
        var cumSplits = [], lapSplits = [];

        if (pan) {
          var bTag = pan.querySelector('b');
          if (bTag) {
            var parts = bTag.innerHTML.split(/<br\s*\/?>/i)
              .map(function(p) { return p.replace(/<[^>]+>/g, '').trim(); })
              .filter(function(p) { return p; });
            parts.forEach(function(p) {
              if (p.indexOf('Sluttid:') === 0)          sluttid = p.replace('Sluttid:', '').trim();
              else if (p.indexOf('FINA') === 0)          fina    = p.replace(/FINA[^:]*:/, '').trim();
              else if (p.indexOf('Påmeldingstid:') === 0 || p.indexOf('P') === 0 && p.indexOf('meldingstid:') > 0)
                                                          pameld  = p.replace(/P[^:]+:/, '').trim();
            });
          }
          var grids = pan.querySelectorAll('.ui-grid-c');
          grids.forEach(function(g, i) {
            var vals = Array.from(g.querySelectorAll('small'))
              .map(function(s) { return s.textContent.trim(); })
              .filter(function(t) { return t; });
            if (i === 0) cumSplits = vals; else lapSplits = vals;
          });
        }

        var h = (backPid ? '<button class="back-btn" id="bb">← Tilbake til utøver</button>' : '') +
                '<div class="card"><div class="card-hdr"><h2>' + e(eventName || 'Detaljresultat') + '</h2></div>' +
                '<div style="padding:15px">' +
                '<div style="font-size:1.05rem;font-weight:700;color:#e0e7ef;margin-bottom:4px;">' + e(person) + '</div>' +
                '<div style="font-size:0.84rem;color:#4fc3f7;margin-bottom:6px;">🏊 ' + e(club) + '</div>' +
                (currentMeetName ? '<div style="font-size:0.78rem;color:#78909c;margin-bottom:12px;">' + e(currentMeetName) + '</div>' : '');

        if (sluttid || fina || pameld) {
          h += '<div class="stats-row">';
          if (sluttid) h += '<div class="stat-item"><div class="stat-lbl">Sluttid</div>' +
                            '<div class="stat-val" style="color:#4fc3f7;font-size:1.25rem;font-family:monospace">' + e(sluttid) + '</div></div>';
          if (fina)    h += '<div class="stat-item"><div class="stat-lbl">FINA-poeng</div>' +
                            '<div class="stat-val">' + e(fina) + '</div></div>';
          if (pameld)  h += '<div class="stat-item"><div class="stat-lbl">Påmeldingstid</div>' +
                            '<div class="stat-val" style="font-family:monospace">' + e(pameld) + '</div></div>';
          h += '</div>';
        }

        if (cumSplits.length > 0) {
          h += '<div class="splits-wrap"><div class="splits-title">Passeringstider (kumulativt)</div>' +
               '<div class="splits-grid">';
          cumSplits.forEach(function(c) { h += '<div class="split-cell" style="color:#4fc3f7">' + e(c) + '</div>'; });
          h += '</div></div>';
        }
        if (lapSplits.length > 0) {
          h += '<div class="splits-wrap" style="padding-top:0"><div class="splits-title">Rundetider</div>' +
               '<div class="splits-grid">';
          lapSplits.forEach(function(c) { h += '<div class="split-cell">' + e(c) + '</div>'; });
          h += '</div></div>';
        }

        h += '</div></div>';
        main.innerHTML = h;
        if (backPid) {
          var bb = main.querySelector('#bb');
          if (bb) bb.addEventListener('click', function() { showAthlete(backPid); });
        }
      })
      .catch(function(err) {
        byId('main').innerHTML = '<div class="empty"><p>Feil: ' + e(err.message || err) + '</p></div>';
      });
  }

  function showEvent(ovnr, eventName) {
    if (!currentMeetNo) return;
    var main = byId('main');
    main.innerHTML = '<div class="loading"><div class="spinner"></div><br>Laster øvelse...</div>';
    document.querySelectorAll('.ath-item').forEach(function(el) { el.classList.remove('active'); });

    fpSmart('/resultater.aspx?stevnenr=' + encodeURIComponent(currentMeetNo) + '&ovnr=' + encodeURIComponent(ovnr))
      .then(function(doc) {
        var pan = doc.getElementById('panResultatlister');
        if (!pan) { main.innerHTML = '<div class="empty"><p>Ingen resultater</p></div>'; return; }

        var h = '<div class="card"><div class="card-hdr"><h2>' + e(eventName) + '</h2>' +
                (currentMeetName ? '<span class="badge">' + e(currentMeetName) + '</span>' : '') + '</div>';
        var kids = Array.from(pan.children);
        var i = 0;
        while (i < kids.length) {
          if (kids[i].tagName === 'H3') {
            h += '<div class="cls-hdr">' + e(kids[i].textContent.trim()) + '</div>';
            i++;
            if (i < kids.length && kids[i].tagName === 'UL') {
              kids[i].querySelectorAll('li').forEach(function(li) {
                var a = li.querySelector('a');
                var href = a ? a.getAttribute('href') || '' : '';
                var rm = href.match(/resid=(\d+)/);
                var resid = rm ? rm[1] : null;
                var cnt = li.querySelector('.ui-li-count');
                var rank = cnt ? cnt.textContent.trim() : '-';
                var smalls = li.querySelectorAll('small');
                var name='', club='', time='';
                if (smalls.length >= 6) {
                  name=smalls[0].textContent.trim(); club=smalls[2].textContent.trim(); time=smalls[4].textContent.trim();
                } else if (smalls.length >= 4) {
                  name=smalls[0].textContent.trim(); club=smalls[2].textContent.trim(); time=smalls[3].textContent.trim();
                } else if (smalls.length >= 3) {
                  name=smalls[0].textContent.trim(); club=smalls[1].textContent.trim(); time=smalls[2].textContent.trim();
                } else if (smalls.length >= 2) {
                  name=smalls[0].textContent.trim(); time=smalls[1].textContent.trim();
                }
                var rn = parseInt(rank, 10);
                var rc = rn===1?'r1':rn===2?'r2':rn===3?'r3':'';
                var tc = ['DNF','DSQ','DNS','DISK'].indexOf(time) >= 0 ? 'dnf' : '';
                h += '<div class="res-row" style="' + (resid ? 'cursor:pointer' : '') + '" ' +
                     (resid ? 'data-resid2="' + e(resid) + '"' : '') + '>' +
                     '<div class="rank ' + rc + '">' + e(rank) + '</div>' +
                     '<div class="res-info"><div class="res-ev">' + e(name) + '</div>' +
                     (club ? '<div class="res-cls">' + e(club) + '</div>' : '') +
                     '</div><div class="res-time ' + tc + '">' + e(time) + '</div></div>';
              });
              i++;
            }
          } else { i++; }
        }
        h += '</div>';
        main.innerHTML = h;
        main.querySelectorAll('[data-resid2]').forEach(function(el) {
          el.addEventListener('click', function() {
            var resid = el.dataset.resid2;
            getPid(resid).then(function(pid) {
              if (pid) showAthlete(pid, resid);
              else showDetail(resid, eventName, null);
            });
          });
        });
      })
      .catch(function(err) {
        byId('main').innerHTML = '<div class="empty"><p>Feil: ' + e(err.message || err) + '</p></div>';
      });
  }

  function e(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  initYearSelect();
  proxyInfo('Henter via egen online API (/api/medley)');
  resetForMeetChange();
  loadMeetsForYear(currentYear);
})();
</script>
</body>
</html>
